name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Website address (must start with https://)"
        required: false
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      # If you uploaded the project as a .zip, unpack it here
      - name: Unzip project (only when uploaded as a zip)
        run: |
          if [ ! -f package.json ]; then
            Z=$(ls *.zip | head -n1)
            echo "Unzipping $Z"
            unzip -q "$Z" -d _proj
            D=$(dirname "$(find _proj -name package.json -not -path '*/node_modules/*' | head -n1)")
            cp -a "$D"/. .
            rm -rf _proj
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu-latest already includes the Android SDK, so we only add what we need
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Install packages
        run: npm ci

      - name: Set your website address
        run: node scripts/set-url.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prottasha-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
